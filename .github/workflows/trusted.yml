# The trusted run of test T2 and of the control. The orchestrator or a person starts it by hand.
#
# The job "hold" waits first. Thus a job of a fork can name the run label before the job "target" asks for a runner.
name: Trusted run

on:
  workflow_dispatch:
    inputs:
      hold:
        description: The seconds before the job target asks for a runner, from 0 to 600
        required: false
        default: "0"
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hold:
    name: Hold
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait
        env:
          HOLD: ${{ inputs.hold }}
        run: |
          set -euo pipefail
          if ! [[ "$HOLD" =~ ^[0-9]{1,3}$ ]] || [ "$HOLD" -gt 600 ]; then
            echo "::error::The input hold is not a whole number from 0 to 600."
            exit 1
          fi
          sleep "$HOLD"

  target:
    name: Target
    needs: hold
    runs-on: run-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 5
    steps:
      - name: Tell the run
        run: echo "The trusted job runs."
