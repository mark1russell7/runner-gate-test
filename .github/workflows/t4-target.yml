# Test T4: a run of pull_request_target names the run label of its own run. The dispatcher refuses the event, so no runner starts.
#
# A run of this event has the token and the secrets of the base repository, also for a pull request from a fork.
# Thus this workflow has no checkout, no secret and the permissions {}. The guard test holds these facts.
name: T4 pull_request_target

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  probe:
    name: Probe
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: run-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 5
    steps:
      - name: Tell the run
        run: echo "A pull_request_target job runs."
